
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odin Sign Up</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">

    <!-- Left image panel -->
    <section class="sidebar">
      <div class="logo">
        <span class="logo-icon">♙</span>
        <span class="logo-text">ODIN</span>
      </div>

      <p class="photo-credit">
        Photo by
        <a href="https://unsplash.com" target="_blank">Halie West</a>
        on Unsplash
      </p>
    </section>

    <!-- Right content panel -->
    <section class="content">

      <header class="intro">
        <p>
          This is not a real online service! You know you need
          something like this in your life to help you realize
          your deepest dreams. Sign up <em>now</em> to get started.
        </p>

        <p>You know you want to.</p>
      </header>

      <section class="form-section">
        <h2>Let's do this!</h2>

        <form action="#" method="post">
          <div class="form-grid">

            <div class="field">
              <label for="first-name">FIRST NAME</label>
              <input
                type="text"
                id="first-name"
                name="first-name"
                autocomplete="given-name"
              />
            </div>

            <div class="field">
              <label for="last-name">LAST NAME</label>
              <input
                type="text"
                id="last-name"
                name="last-name"
                value="Odinson"
                autocomplete="family-name"
                autofocus
              />
            </div>

            <div class="field">
              <label for="email">EMAIL</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
              />
            </div>

            <div class="field">
              <label for="phone">PHONE NUMBER</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                autocomplete="tel"
              />
            </div>

            <div class="field">
              <label for="password">PASSWORD</label>
              <input
                type="password"
                id="password"
                name="password"
                class="invalid"
                autocomplete="new-password"
              />
            </div>

            <div class="field">
              <label for="confirm-password">
                CONFIRM PASSWORD
              </label>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                class="invalid"
                autocomplete="new-password"
              />
            </div>

          </div>

          <div class="form-actions">
            <button type="submit">Create Account</button>

            <p class="login">
              Already have an account?
              <a href="#">Log in</a>
            </p>
          </div>
        </form>
      </section>

    </section>
  </main>
</body>
</html>
